<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모나리자</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            background-color: azure;
        }
        .outer{
            width: 200px;
            height: 200px;
            background-color: beige;
            border-radius: 50%;
            overflow: hidden;
            padding: 20px;
        }
        .with-bg{
            width: 100%;
            height: 100%;
            background-image: url("images/images/모나리자.jpg");
            background-size: cover;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="with-bg"></div>
    </div>
</body>
</html>
