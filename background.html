<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강아지</title>
    <style>
        .area{
            width: 509px;
            height: 500px;
            /* height: 500px; */
            aspect-ratio: 509/339;
            background-image: url(images/images/dog.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: top;
            background-position: bottom;
            background-position: right bottom;
            background-color: aquamarine;
        }
        .dog{
            width: 100%;
            aspect-ratio: 1000/714;
            background-image: url(images/images/dogg.jpg);
            background-repeat: no-repeat;
            background-size: 100%;

        }
    </style>
</head>
<body>
    <div class="area"></div>

    <div class="dog"></div>
</body>
</html>
